name: CI

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (syntax / undefined-name checks)
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest -q
  playwright-tests:
      runs-on: ubuntu-latest
      # Wait for the backend tests to pass first to save resources
      needs: pytest
      steps:
        - uses: actions/checkout@v4
          # set up python within node container so that it can run fastapi for local tests
        - name: Set up Python Runtime
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
          # I need to install libraries needed
        - name: Install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y unixodbc-dev

        - name: Install Python dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install -e .

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: lts/*
            cache: 'npm'

        - name: Install dependencies
          run: npm ci # clean install every run

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps

        - name: Run Playwright tests
          run: npx playwright test
          env:
            KEYWORD_THRESHOLD: 3
            KEYWORD_MARGIN: 5
            # Pass github secret vault
            AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
            DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
            AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
