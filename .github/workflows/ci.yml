name: CI

on:
  push:
    branches:
      - "typescript_tests_update_apim"

# This allows GitHub to request the secure passwordless login token from Azure
permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (syntax / undefined-name checks)
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest -q

  playwright-tests:
    runs-on: ubuntu-latest
    # Wait for the backend tests to pass first to save resources
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      # ---- START: APIM GENERATION & UPDATE STEPS ----
      - name: Set up Python (for FastAPI schema extraction)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (for FastAPI schema extraction)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Generate OpenAPI Schema from FastAPI
        run: |
          python -m generate_latest_api_json

      - name: Azure Login (OIDC Passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Latest FastAPI Code to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "AzD-contract-mapping-2328"   # <-- Replace with your Azure Web App name
          package: "."                        # Push your current repository directory


      - name: Update Azure APIM API Spec
        run: |
          az apim api import \
            --resource-group "AzD-UKS-AI" \
            --service-name "azd-contract-mapping-apim-dev" \
            --api-id "contractmap_dev_env" \
            --path "/contractmap_dev_env" \
            --specification-format "OpenApiJson" \
            --specification-path "output/openapi.json" \
            --protocols "https"
    

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Pass github secret vault
          APIM_URL: ${{ secrets.APIM_URL }}
          APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}